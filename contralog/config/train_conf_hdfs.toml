[Data]
raw_path = './data/HDFS_V1/HDFS.log'
# label_path only needed for HDFS
label_path = './data/HDFS_v1/preprocessed/anomaly_label.csv'
data_path = './data/HDFS_Sequences/'
n_workers = 4

train_frac = 0.6
val_frac = 0.05
fit_frac = 0.05
test_frac = 0.30
balance_test = true

tokenizer_fit_samples = 400_000

[Train]
n_max_epochs = 400
lr = 1e-4
n_mask = 0.15
max_grad_norm = 1.0
batch_size = 256

[EarlyStopping]
patience = 12
min_delta = 0.0

[Misc]
device = 'cuda'

save = true
save_path = './models/'
run_name = 'hdfs_ideal'

warm_start = false
warm_start_model_path = './models/hdfs/'

calc_tokenizer_stats = true
n_sequences_tokenizer_stats = 5_000

store_loss = true
plot_loss = true

[Test]
model_path = './models/hdfs/'
percentile_threshold = 95

max_point_anomaly_ref_samples = 4_000
max_threshold_fit_samples = 4_000
max_test_samples = 4_000
#balance normal and abnormal test sequences
balance_test = true