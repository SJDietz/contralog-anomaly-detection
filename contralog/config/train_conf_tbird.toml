[Data]
raw_path = './data/Thunderbird/Thunderbird.log'
data_path = './data/TBird_sequences/'
n_workers = 0

train_frac = 0.6
val_frac = 0.05
fit_frac = 0.05
test_frac = 0.30
balance_test = true

tokenizer_fit_samples = 400_000

# Only relevant for BGL&TBird
window_size = 60 #s
max_samples = 256

[Train]
n_max_epochs = 200
lr = 5e-5
n_mask = 0.15
max_grad_norm = 0.5
batch_size = 32 

[EarlyStopping]
patience = 4
min_delta = 0.0

[Misc]
device = 'cuda'

save = true
save_path = './models/'
run_name = 'tbird'

warm_start = false
warm_start_model_path = './models/tbird/'

calc_tokenizer_stats = true
n_sequences_tokenizer_stats = 200

store_loss = true
plot_loss = true

[Test]
model_path = './models/tbird/'
percentile_threshold = 95

max_point_anomaly_ref_samples = 4_000
max_threshold_fit_samples = 4_000
max_test_samples = 4_000
#balance normal and abnormal test sequences
balance_test = true